name: Github CI Cleanup

on: workflow_dispatch

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Repository ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: write
      deployments: write

    steps:
      - name: Checkout Repository ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Cleanup Workflow Runs
        uses: actions/github-script@v9
        with:
          script: |
            const { default: cleanupWorkflowRuns } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cleanup-workflow-runs.js`);
            await cleanupWorkflowRuns({ core, context, github });

      - name: Cleanup Deployments
        uses: actions/github-script@v9
        with:
          script: |
            const { default: cleanupDeployments } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cleanup-deployments.js`);
            await cleanupDeployments({ core, context, github });
