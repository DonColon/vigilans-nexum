name: Node CI Build

on:
  push:
    branches: ["main", "dev", "feature**"]
  pull_request:
    branches: ["main", "dev"]

# Every job only reads by default, the release job asks for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on main,
# so a production release is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  code_quality:
    name: Check Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          # Sonar needs the full history for blame and new-code detection.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Prettier Rules
        run: npm run format:check --if-present

      - name: Check ESLint Rules
        run: npm run lint --if-present

      - name: Test Application with Coverage Report
        run: npm run test:coverage --if-present

      - name: Publish Coverage Report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

      - name: Application Version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The version from package.json lets Sonar's "previous version" new-code
      # period on main start at each release instead of at the first analysis.
      - name: Check Sonarcloud Rules
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.projectVersion=${{ steps.app_version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      artifact: ${{ steps.app_version.outputs.artifact }}

    steps:
      - name: Checkout Repository ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build --if-present

      - name: Application Version
        id: app_version
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "Application Version: $version"
          echo "artifact=${{ github.event.repository.name }}-build-$version" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app_version.outputs.artifact }}
          path: dist
          if-no-files-found: error

  release:
    name: Release Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [code_quality, build]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')

    permissions:
      contents: write

    steps:
      - name: Checkout Repository ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Zip Build Artifact
        run: cd dist && zip -r "$RUNNER_TEMP/build.zip" .

      - name: Retrieve Latest Release
        uses: actions/github-script@v9
        id: retrieve_latest_release
        with:
          script: |
            const { default: retrieveLatestRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/retrieve-latest-release.js`);
            await retrieveLatestRelease({ core, context, github });

      - name: Upload Release Asset
        uses: actions/github-script@v9
        env:
          RELEASE: ${{ steps.retrieve_latest_release.outputs.release }}
        with:
          script: |
            const { default: uploadReleaseAsset } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upload-release-asset.js`);
            const release = JSON.parse(process.env.RELEASE);
            const assetPath = `${process.env.RUNNER_TEMP}/build.zip`;
            await uploadReleaseAsset({ core, context, github, release, assetPath });

      - name: Publish Latest Release
        uses: actions/github-script@v9
        env:
          RELEASE: ${{ steps.retrieve_latest_release.outputs.release }}
        with:
          script: |
            const { default: publishLatestRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-latest-release.js`);
            const release = JSON.parse(process.env.RELEASE);
            await publishLatestRelease({ core, context, github, release });

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [build, release]

    env:
      netlify_version: 27.16.2

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy_app.outputs.url }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Deploy Application with Netlify ${{ env.netlify_version }}
        id: deploy_app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE }}
          PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
        run: |
          npx --yes "netlify-cli@${netlify_version}" deploy --json --dir dist $PROD_FLAG > "$RUNNER_TEMP/deploy.json"
          url="$(jq -r '.url // .deploy_url' "$RUNNER_TEMP/deploy.json")"
          echo "Deployed app at url: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
